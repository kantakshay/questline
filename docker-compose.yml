services:
  gitea:
    image: gitea/gitea:1.22
    container_name: dev-cycle-gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__server__ROOT_URL=http://localhost:3001/
    restart: unless-stopped
    volumes:
      - ./data/gitea:/data
    ports:
      - "3001:3000"
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: dev-cycle-dynamodb
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "./data"]
    volumes:
      - ./data/dynamodb:/home/dynamodblocal/data
    ports:
      - "8000:8000"
  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    container_name: dev-cycle-dynamodb-admin
    environment:
      - DYNAMO_ENDPOINT=http://dynamodb-local:8000
    ports:
      - "8001:8001"
    depends_on:
      - dynamodb-local
