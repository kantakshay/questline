# Fixed project name so containers, network and volumes are "questline_*"
# no matter what the checkout folder is called.
name: questline

services:
  gitea:
    image: gitea/gitea:1.22
    container_name: questline-gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__server__ROOT_URL=http://localhost:3001/
      # Gitea blocks webhooks to private addresses by default; allow the host-run backend.
      - GITEA__webhook__ALLOWED_HOST_LIST=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    volumes:
      - ./data/gitea:/data
    ports:
      - "3001:3000"
  postgres:
    # Local stand-in for the production Postgres (Neon). Keep the major version in sync.
    image: postgres:16
    container_name: questline-postgres
    environment:
      - POSTGRES_USER=questline
      - POSTGRES_PASSWORD=questline
      - POSTGRES_DB=questline
    restart: unless-stopped
    volumes:
      # Named volume, not a ./data bind mount: Postgres needs an empty directory it owns,
      # which Windows bind mounts can't guarantee. Survives restarts; `docker compose down -v` wipes it.
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres-data:
